<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" role="img" aria-labelledby="t d">
  <title id="t">How blendfile reads a file</title>
  <desc id="d">The bytes are decompressed when they start with a gzip or zstd signature, the 12-byte or 17-byte file header gives pointer size, byte order and block header layout, the block list is read, the DNA1 block becomes the SDNA type catalog, and BlendStruct views and readScene read members, pointers and scenes from it.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="960" y2="250" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #ffffff; fill-opacity: 0.06; stroke-width: 1.5; }
    .h { font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .c { font-size: 12px; fill: #e2e8f0; }
    .s { font-size: 12px; fill: #94a3b8; }
    .flow { stroke: #94a3b8; stroke-width: 2; fill: none; marker-end: url(#arrow); }
  </style>
  <rect width="960" height="250" rx="20" fill="url(#bg)"/>
  <g class="sans">
    <rect x="24" y="56" width="140" height="140" rx="10" class="box" stroke="#94a3b8"/>
    <text x="38" y="82" class="h">Your bytes</text>
    <text x="38" y="110" class="mono c">Uint8Array</text>
    <text x="38" y="130" class="mono c">ArrayBuffer</text>
    <text x="38" y="164" class="s">readFile, a File,</text>
    <text x="38" y="182" class="s">a fetch response</text>
    <path d="M164 126H184" class="flow"/>

    <rect x="188" y="56" width="140" height="140" rx="10" class="box" stroke="#f5792a"/>
    <text x="202" y="82" class="h">Decompress</text>
    <text x="202" y="110" class="mono c">gzip  (fflate)</text>
    <text x="202" y="130" class="mono c">zstd  (fzstd)</text>
    <text x="202" y="164" class="s">detected from the</text>
    <text x="202" y="182" class="s">first bytes</text>
    <path d="M328 126H348" class="flow"/>

    <rect x="352" y="56" width="140" height="140" rx="10" class="box" stroke="#e8508f"/>
    <text x="366" y="82" class="h">File header</text>
    <text x="366" y="110" class="mono c">12 bytes  ≤ 4.x</text>
    <text x="366" y="130" class="mono c">17 bytes  5.x</text>
    <text x="366" y="164" class="s">pointer size, byte</text>
    <text x="366" y="182" class="s">order, block layout</text>
    <path d="M492 126H512" class="flow"/>

    <rect x="516" y="56" width="140" height="140" rx="10" class="box" stroke="#8b5cf6"/>
    <text x="530" y="82" class="h">Blocks</text>
    <text x="530" y="110" class="mono c">OB ME MA …</text>
    <text x="530" y="130" class="mono c">DNA1  ENDB</text>
    <text x="530" y="164" class="s">code, size, old</text>
    <text x="530" y="182" class="s">address, struct</text>
    <path d="M656 126H676" class="flow"/>

    <rect x="680" y="56" width="120" height="140" rx="10" class="box" stroke="#6366f1"/>
    <text x="694" y="82" class="h">SDNA</text>
    <text x="694" y="110" class="mono c">types</text>
    <text x="694" y="130" class="mono c">structs</text>
    <text x="694" y="164" class="s">the file's own</text>
    <text x="694" y="182" class="s">type catalog</text>
    <path d="M800 126H820" class="flow"/>

    <rect x="824" y="56" width="112" height="140" rx="10" class="box" stroke="#3d7ae0"/>
    <text x="838" y="82" class="h">Read</text>
    <text x="838" y="110" class="mono c">BlendStruct</text>
    <text x="838" y="130" class="mono c">readScene</text>
    <text x="838" y="164" class="s">members and</text>
    <text x="838" y="182" class="s">pointers</text>
  </g>
  <text x="24" y="34" class="sans" font-size="13" font-weight="700" letter-spacing="2" fill="#f5792a">READ</text>
  <text x="24" y="230" class="sans s">Nothing is decoded until you ask for it: a BlendStruct reads members lazily, by name, through the SDNA.</text>
</svg>
