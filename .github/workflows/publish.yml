# VERIFIED: publishes the library to npm when a version tag is pushed (git tag v0.1.1 && git push origin v0.1.1).
# npm trusted publishing: npm checks this workflow's OIDC identity, so no npm token is stored in GitHub and every
# release carries a provenance statement. Set it up once on npmjs.com, package blendfile → Settings → Trusted
# publishing: GitHub Actions, owner Mansi1, repository blendfile, workflow publish.yml.
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # Trusted publishing needs npm 11.5.1 or later; Node 24 ships it.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: make lint
      # prepublishOnly builds dist/ and runs the unit tests; the consumer test installs the packed tarball into a clean
      # project and reads every fixture under Node as ESM and CJS.
      - run: make build
      - run: bun e2e/consumer.ts
      - run: npm publish --provenance --access public
